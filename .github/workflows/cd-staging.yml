name: CD Staging

on:
  push:
    branches:
      - develop

env:
  REGION: ${{ secrets.GCP_REGION }}
  SERVICE: portfolio-staging

jobs:
  deploy:
    name: Build & Deploy to Staging
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🔐 Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      - name: ☁️ Set up gcloud CLI
        uses: google-github-actions/setup-gcloud@v2

      - name: 🐳 Configure Docker for Artifact Registry
        run: gcloud auth configure-docker europe-west1-docker.pkg.dev --quiet

      - name: 🔨 Build Docker image
        env:
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
        run: |
          IMAGE=$(echo "europe-west1-docker.pkg.dev/${GCP_PROJECT_ID}/portfolio/portfolio-staging" | tr '[:upper:]' '[:lower:]')
          echo "🏗️ Building image: ${IMAGE}:${{ github.sha }}"
          docker build -t ${IMAGE}:${{ github.sha }} .
          docker tag ${IMAGE}:${{ github.sha }} ${IMAGE}:latest
          echo "IMAGE=${IMAGE}" >> $GITHUB_ENV

      - name: 📤 Push Docker image
        run: |
          echo "📦 Pushing image to Artifact Registry..."
          docker push ${{ env.IMAGE }}:${{ github.sha }}
          docker push ${{ env.IMAGE }}:latest
          echo "✅ Image pushed successfully"

      - name: 🚀 Deploy to Cloud Run (Staging)
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ env.SERVICE }}
          region: ${{ env.REGION }}
          image: ${{ env.IMAGE }}:${{ github.sha }}
          flags: --allow-unauthenticated

      - name: 🌍 Show Staging URL
        run: |
          URL=$(gcloud run services describe ${{ env.SERVICE }} --region=${{ env.REGION }} --format='value(status.url)')
          echo "✅ Staging deployed → ${URL}"
